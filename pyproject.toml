# Workspace-level tooling only. Each deployable lives in services/<name> with its own pyproject.
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]
"**/app/**" = ["E501"]
"**/migrations/**" = ["E501", "I001", "UP"]
"**/tools/**" = ["E501", "ASYNC230", "ASYNC240", "ASYNC251"]
"tools/**" = ["E501", "ASYNC230", "ASYNC240", "ASYNC251"]
