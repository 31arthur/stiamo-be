[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stiamo-common"
version = "0.1.0"
description = "Shared kernel for Stiamo services: JWT verification, error model, DB helpers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pyjwt>=2.8",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
