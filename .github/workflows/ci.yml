name: ci
# Pushes to main are tested by the publish workflow before it builds anything, so this one runs for pull requests and by hand:
# running both on every push tested the same commit twice.
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [libs/stiamo_common, services/identity, services/records, services/practice, services/files, services/drive, services/agent, services/mail, services/calendar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e libs/stiamo_common pytest pytest-asyncio ruff
      - run: ruff check .
      - if: matrix.target != 'libs/stiamo_common'
        run: pip install -e "${{ matrix.target }}[dev]"
      - run: cd ${{ matrix.target }} && pytest -q
