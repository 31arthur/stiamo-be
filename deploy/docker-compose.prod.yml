# Production stack for the VPS, behind the existing Traefik (external network `traefik-proxy`).
# Images come from GHCR (built by .github/workflows/publish.yml).
# Public host: stiamo-be.fullstackarthur.com
#   /v1/auth/*, /v1/users/*  -> identity
#   /v1/collections/*        -> records
#   /v1/tasks, /v1/cases, /v1/plans, ... (the working domain) -> practice
#   /v1/attachments/*, /v1/files/*  -> files
#   /v1/drive/*              -> drive (searches your Google Drive; copies nothing)
#   /v1/agent/*              -> agent (AI providers, the case agent, Telegram and WhatsApp webhooks)
name: stiamo-be

x-logging: &logging
  driver: "json-file"
  options: { max-size: "10m", max-file: "3" }

services:
  identity:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/stiamo-be-identity:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose: ["8000"]
    environment:
      IDENTITY_ENV: production
      IDENTITY_DATABASE_URL: postgresql+asyncpg://stiamo_identity:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}@db:5432/stiamo_identity
      IDENTITY_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      IDENTITY_CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      IDENTITY_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      IDENTITY_ACCESS_TTL_MINUTES: ${ACCESS_TTL_MINUTES:-15}
      IDENTITY_REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
    depends_on:
      db: { condition: service_healthy }
    networks: [stiamo-net, traefik-proxy]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 128M }
    logging: *logging
    # The image defines its own HEALTHCHECK (GET /health).
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.stiamo-identity.rule=Host(`stiamo-be.fullstackarthur.com`) && (PathPrefix(`/v1/auth`) || PathPrefix(`/v1/users`))"
      - "traefik.http.routers.stiamo-identity.entrypoints=websecure"
      - "traefik.http.routers.stiamo-identity.tls=true"
      - "traefik.http.routers.stiamo-identity.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stiamo-identity.middlewares=stiamo-retry"
      - "traefik.http.services.stiamo-identity.loadbalancer.server.port=8000"
      - "traefik.http.services.stiamo-identity.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.stiamo-identity.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.stiamo-identity.loadbalancer.healthcheck.timeout=10s"
      - "traefik.http.middlewares.stiamo-retry.retry.attempts=3"
      - "traefik.http.middlewares.stiamo-retry.retry.initialinterval=100ms"

  records:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/stiamo-be-records:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose: ["8000"]
    environment:
      RECORDS_ENV: production
      RECORDS_DATABASE_URL: postgresql+asyncpg://stiamo_records:${RECORDS_DB_PASSWORD:?set RECORDS_DB_PASSWORD}@db:5432/stiamo_records
      RECORDS_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      RECORDS_CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
    depends_on:
      db: { condition: service_healthy }
    networks: [stiamo-net, traefik-proxy]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 128M }
    logging: *logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.stiamo-records.rule=Host(`stiamo-be.fullstackarthur.com`) && PathPrefix(`/v1/collections`)"
      - "traefik.http.routers.stiamo-records.entrypoints=websecure"
      - "traefik.http.routers.stiamo-records.tls=true"
      - "traefik.http.routers.stiamo-records.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stiamo-records.middlewares=stiamo-retry"
      - "traefik.http.services.stiamo-records.loadbalancer.server.port=8000"
      - "traefik.http.services.stiamo-records.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.stiamo-records.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.stiamo-records.loadbalancer.healthcheck.timeout=10s"

  practice:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/stiamo-be-practice:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose: ["8000"]
    environment:
      PRACTICE_ENV: production
      PRACTICE_DATABASE_URL: postgresql+asyncpg://stiamo_practice:${PRACTICE_DB_PASSWORD:?set PRACTICE_DB_PASSWORD}@db:5432/stiamo_practice
      PRACTICE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      PRACTICE_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PRACTICE_FILES_URL: http://files:8000
    depends_on:
      db: { condition: service_healthy }
    networks: [stiamo-net, traefik-proxy]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 128M }
    logging: *logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.stiamo-practice.rule=Host(`stiamo-be.fullstackarthur.com`) && (PathPrefix(`/v1/tasks`) || PathPrefix(`/v1/follow-ups`) || PathPrefix(`/v1/meetings`) || PathPrefix(`/v1/cases`) || PathPrefix(`/v1/hearings`) || PathPrefix(`/v1/plans`) || PathPrefix(`/v1/goals`) || PathPrefix(`/v1/counsel`) || PathPrefix(`/v1/clients`) || PathPrefix(`/v1/projects`) || PathPrefix(`/v1/links`) || PathPrefix(`/v1/activity`) || PathPrefix(`/v1/outcomes`) || PathPrefix(`/v1/agenda`) || PathPrefix(`/v1/relations`) || PathPrefix(`/v1/steps`))"
      - "traefik.http.routers.stiamo-practice.entrypoints=websecure"
      - "traefik.http.routers.stiamo-practice.tls=true"
      - "traefik.http.routers.stiamo-practice.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stiamo-practice.middlewares=stiamo-retry"
      - "traefik.http.services.stiamo-practice.loadbalancer.server.port=8000"
      - "traefik.http.services.stiamo-practice.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.stiamo-practice.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.stiamo-practice.loadbalancer.healthcheck.timeout=10s"

  files:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/stiamo-be-files:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose: ["8000"]
    environment:
      FILES_ENV: production
      FILES_DATABASE_URL: postgresql+asyncpg://stiamo_files:${FILES_DB_PASSWORD:?set FILES_DB_PASSWORD}@db:5432/stiamo_files
      FILES_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      FILES_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FILES_PRACTICE_URL: http://practice:8000
      FILES_STORAGE_DIR: /data/files
    depends_on:
      db: { condition: service_healthy }
    networks: [stiamo-net, traefik-proxy]
    volumes:
      - stiamo-files:/data/files
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 128M }
    logging: *logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.stiamo-files.rule=Host(`stiamo-be.fullstackarthur.com`) && (PathPrefix(`/v1/attachments`) || PathPrefix(`/v1/files`))"
      - "traefik.http.routers.stiamo-files.entrypoints=websecure"
      - "traefik.http.routers.stiamo-files.tls=true"
      - "traefik.http.routers.stiamo-files.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stiamo-files.middlewares=stiamo-retry"
      - "traefik.http.services.stiamo-files.loadbalancer.server.port=8000"
      - "traefik.http.services.stiamo-files.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.stiamo-files.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.stiamo-files.loadbalancer.healthcheck.timeout=10s"

  drive:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/stiamo-be-drive:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose: ["8000"]
    environment:
      DRIVE_ENV: production
      DRIVE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DRIVE_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DRIVE_CREDENTIALS_FILE: /run/secrets/drive.json
      DRIVE_FOLDER_ID: ${DRIVE_FOLDER_ID:-}
      DRIVE_ALLOWED_EMAILS: ${DRIVE_ALLOWED_EMAILS:-}
    # The service account's key lives in ./secrets/drive.json on the server (see docs/DRIVE_SETUP.md); never in Git.
    volumes:
      - ./secrets:/run/secrets:ro
    networks: [stiamo-net, traefik-proxy]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
        reservations: { memory: 64M }
    logging: *logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.stiamo-drive.rule=Host(`stiamo-be.fullstackarthur.com`) && PathPrefix(`/v1/drive`)"
      - "traefik.http.routers.stiamo-drive.entrypoints=websecure"
      - "traefik.http.routers.stiamo-drive.tls=true"
      - "traefik.http.routers.stiamo-drive.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stiamo-drive.middlewares=stiamo-retry"
      - "traefik.http.services.stiamo-drive.loadbalancer.server.port=8000"
      - "traefik.http.services.stiamo-drive.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.stiamo-drive.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.stiamo-drive.loadbalancer.healthcheck.timeout=10s"

  agent:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/stiamo-be-agent:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose: ["8000"]
    environment:
      AGENT_ENV: production
      AGENT_DATABASE_URL: postgresql+asyncpg://stiamo_agent:${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD}@db:5432/stiamo_agent
      AGENT_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      # Encrypts the AI keys and channel tokens stored in the database. Losing it means entering them again.
      AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:?set AGENT_SECRET_KEY (docs/AGENT_SETUP.md)}
      # Where Telegram and Twilio send messages: this host's public https address.
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-https://stiamo-be.fullstackarthur.com}
      AGENT_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AGENT_PRACTICE_URL: http://practice:8000
      AGENT_FILES_URL: http://files:8000
      AGENT_DRIVE_URL: http://drive:8000
    depends_on:
      db: { condition: service_healthy }
    networks: [stiamo-net, traefik-proxy]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 128M }
    logging: *logging
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.stiamo-agent.rule=Host(`stiamo-be.fullstackarthur.com`) && PathPrefix(`/v1/agent`)"
      - "traefik.http.routers.stiamo-agent.entrypoints=websecure"
      - "traefik.http.routers.stiamo-agent.tls=true"
      - "traefik.http.routers.stiamo-agent.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stiamo-agent.middlewares=stiamo-retry"
      - "traefik.http.services.stiamo-agent.loadbalancer.server.port=8000"
      - "traefik.http.services.stiamo-agent.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.stiamo-agent.loadbalancer.healthcheck.interval=30s"
      - "traefik.http.services.stiamo-agent.loadbalancer.healthcheck.timeout=10s"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stiamo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      RECORDS_DB_PASSWORD: ${RECORDS_DB_PASSWORD}
      PRACTICE_DB_PASSWORD: ${PRACTICE_DB_PASSWORD}
      FILES_DB_PASSWORD: ${FILES_DB_PASSWORD}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD}
    volumes:
      - stiamo-pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks: [stiamo-net]   # not on traefik-proxy: never reachable from outside
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stiamo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

networks:
  stiamo-net:
    driver: bridge
  traefik-proxy:
    external: true

volumes:
  stiamo-pgdata:
  stiamo-files:
