services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stiamo
      POSTGRES_PASSWORD: stiamo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stiamo"]
      interval: 3s
      retries: 20

  identity:
    build: { context: ., dockerfile: services/identity/Dockerfile }
    environment:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://stiamo:stiamo@postgres:5432/stiamo_identity
      IDENTITY_JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8001:8000"]

  records:
    build: { context: ., dockerfile: services/records/Dockerfile }
    environment:
      RECORDS_DATABASE_URL: postgresql+asyncpg://stiamo:stiamo@postgres:5432/stiamo_records
      RECORDS_JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8002:8000"]

  practice:
    build: { context: ., dockerfile: services/practice/Dockerfile }
    environment:
      PRACTICE_DATABASE_URL: postgresql+asyncpg://stiamo:stiamo@postgres:5432/stiamo_practice
      PRACTICE_JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      PRACTICE_FILES_URL: http://files:8000
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8003:8000"]

  files:
    build: { context: ., dockerfile: services/files/Dockerfile }
    environment:
      FILES_DATABASE_URL: postgresql+asyncpg://stiamo:stiamo@postgres:5432/stiamo_files
      FILES_JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      FILES_PRACTICE_URL: http://practice:8000
    volumes: [files:/data/files]
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8004:8000"]

  drive:
    build: { context: ., dockerfile: services/drive/Dockerfile }
    environment:
      DRIVE_JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      DRIVE_CREDENTIALS_FILE: /run/secrets/drive.json
      DRIVE_FOLDER_ID: ${DRIVE_FOLDER_ID:-}
      DRIVE_ALLOWED_EMAILS: ${DRIVE_ALLOWED_EMAILS:-}
    volumes: ["./secrets:/run/secrets:ro"]
    ports: ["8005:8000"]

  agent:
    build: { context: ., dockerfile: services/agent/Dockerfile }
    environment:
      AGENT_DATABASE_URL: postgresql+asyncpg://stiamo:stiamo@postgres:5432/stiamo_agent
      AGENT_JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      AGENT_PRACTICE_URL: http://practice:8000
      AGENT_FILES_URL: http://files:8000
      AGENT_DRIVE_URL: http://drive:8000
      # Telegram and Twilio can only call an https address on the internet: use a tunnel (e.g. ngrok) in development.
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-}
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8006:8000"]

  gateway:
    image: caddy:2-alpine
    volumes: ["./infra/Caddyfile.dev:/etc/caddy/Caddyfile:ro"]
    ports: ["8080:80"]
    depends_on: [identity, practice, files, records, drive, agent]

volumes:
  pgdata:
  files:
